<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming Olympiade - Casino Edition</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  
  <!-- Google Fonts & Canvas Confetti -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --gold: #f39c12;
      --gold-light: #f1c40f;
      --casino-red: #c0392b;
      --casino-darkred: #78281f;
      --casino-green: #27ae60;
      --bg-dark: #0f141d;
      --card-bg: #1e2738;
      --card-border: #2c3e50;
      --text: #ecf0f1;
      --text-dim: #bdc3c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
    body { background: var(--bg-dark); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    /* Modals & Fullscreen Overlays */
    .screen-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: radial-gradient(circle, #2c3e50 0%, #0f141d 100%);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card-box {
      background: var(--card-bg); border: 3px solid var(--gold); border-radius: 20px;
      padding: 30px; max-width: 550px; width: 100%; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .card-box h1 { font-family: 'Fredoka One', cursive; font-size: 2.2rem; color: var(--gold-light); margin-bottom: 10px; }

    /* Buttons */
    .btn {
      padding: 12px 20px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease;
      text-transform: uppercase; font-size: 0.95rem;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #000; }
    .btn-red { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; }
    .btn-blue { background: linear-gradient(135deg, #3498db, #2980b9); color: white; }
    .btn-green { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; }
    .btn-dark { background: #2c3e50; color: white; }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 8px; }

    /* Form Fields */
    .form-group { margin-top: 15px; text-align: left; }
    .form-group label { display: block; font-weight: 800; margin-bottom: 6px; color: var(--gold-light); }
    .form-control {
      width: 100%; padding: 12px; border-radius: 10px; border: 2px solid var(--card-border);
      background: #0f141d; color: white; font-size: 1.1rem; font-weight: 700; outline: none;
    }
    .form-control:focus { border-color: var(--gold); }

    /* Avatar Grid */
    .avatar-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
      max-height: 160px; overflow-y: auto; padding: 8px; margin-top: 8px;
      background: #0f141d; border-radius: 10px; border: 1px solid var(--card-border);
    }
    .avatar-item {
      aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; cursor: pointer;
      background: #1e2738; padding: 4px; transition: all 0.2s ease;
    }
    .avatar-item.selected { border-color: var(--gold-light); background: rgba(241, 196, 15, 0.25); transform: scale(1.1); }
    .avatar-item svg { width: 100%; height: 100%; border-radius: 50%; }

    /* Header */
    header {
      background: #1a2332; border-bottom: 3px solid var(--gold); padding: 12px 25px;
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000;
    }
    .logo { font-family: 'Fredoka One', cursive; font-size: 1.6rem; color: var(--gold-light); }

    /* Main Dashboard Layout */
    .app-container { display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding: 20px; max-width: 1600px; margin: 0 auto; }
    @media (max-width: 1024px) { .app-container { grid-template-columns: 1fr; } }

    .card { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .card-title { font-family: 'Fredoka One', cursive; color: var(--gold-light); font-size: 1.3rem; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

    /* Player Cards */
    .player-card {
      display: flex; align-items: center; justify-content: space-between;
      background: #141c28; border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; margin-bottom: 10px;
    }
    .player-avatar { width: 42px; height: 42px; border-radius: 50%; background: #2c3e50; padding: 2px; }
    .player-avatar svg { width: 100%; height: 100%; border-radius: 50%; }
    .player-name { font-weight: 800; font-size: 1.05rem; }
    .player-score { font-family: 'Fredoka One', cursive; font-size: 1.4rem; color: var(--gold-light); }
    .joker-pill { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 900; background: #2c3e50; }
    .joker-pill.active { background: var(--gold); color: #000; }

    /* Wheel Area */
    .wheel-container { position: relative; width: 320px; height: 320px; margin: 0 auto 20px auto; }
    #wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid var(--gold); transition: transform 4s cubic-bezier(0.15, 0.9, 0.2, 1); }
    .wheel-pointer {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0;
      border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid var(--casino-red);
      z-index: 10; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5));
    }

    /* Phase Banner */
    .phase-card {
      background: linear-gradient(135deg, #1f2c3f, #141c28); border: 2px solid var(--gold);
      border-radius: 16px; padding: 25px; text-align: center; margin-bottom: 20px;
    }
    .phase-title { font-family: 'Fredoka One', cursive; font-size: 1.8rem; color: var(--gold-light); margin-bottom: 10px; }
    .timer-display { font-family: 'Fredoka One', cursive; font-size: 3.2rem; color: white; text-shadow: 0 0 10px var(--gold); margin: 10px 0; }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--card-bg); border: 3px solid var(--gold); border-radius: 20px;
      padding: 25px; max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto;
    }
  </style>
</head>
<body>

  <!-- STEP 1: INITIAL ROLE & ROOM ENTRY -->
  <div id="screen-login" class="screen-overlay">
    <div class="card-box">
      <h1>🎰 GAMING OLYMPIADE</h1>
      <p style="color: var(--text-dim); font-weight: 700; margin-bottom: 15px;">Wähle deine Rolle:</p>

      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button class="btn btn-red" style="flex:1;" onclick="switchLoginTab('host')">👑 Host (Raum erstellen)</button>
        <button class="btn btn-green" style="flex:1;" onclick="switchLoginTab('player')">👤 Teilnehmer (Raum beitreten)</button>
      </div>

      <!-- Host Form -->
      <div id="tab-host" style="text-align: left;">
        <div class="form-group">
          <label>Raum-Code festlegen (z.B. OLYMPIA26):</label>
          <input type="text" id="host-room-input" class="form-control" value="OLYMPIA26" style="text-transform: uppercase;">
        </div>
        <div class="form-group">
          <label>Host PIN-Code (Standard: 1234):</label>
          <input type="password" id="host-pin-input" class="form-control" value="1234" maxlength="4">
        </div>
        <div class="form-group">
          <label>Dein Name:</label>
          <input type="text" id="host-name-input" class="form-control" value="Host">
        </div>
        <div class="form-group">
          <label>Dein Avatar:</label>
          <div class="avatar-grid" id="host-avatar-grid"></div>
        </div>
        <button class="btn btn-gold" style="width: 100%; margin-top: 20px;" onclick="createRoomAsHost()">Raum Erstellen & Starten 🚀</button>
      </div>

      <!-- Player Form -->
      <div id="tab-player" style="text-align: left; display: none;">
        <div class="form-group">
          <label>Raum-Code vom Host eingeben:</label>
          <input type="text" id="player-room-input" class="form-control" placeholder="z.B. OLYMPIA26" style="text-transform: uppercase;">
        </div>
        <div class="form-group">
          <label>Dein Name:</label>
          <input type="text" id="player-name-input" class="form-control" placeholder="Dein Name...">
        </div>
        <div class="form-group">
          <label>Dein Avatar:</label>
          <div class="avatar-grid" id="player-avatar-grid"></div>
        </div>
        <button class="btn btn-green" style="width: 100%; margin-top: 20px;" onclick="joinRoomAsPlayer()">Dem Raum Beitreten ➡️</button>
      </div>

    </div>
  </div>

  <!-- HEADER -->
  <div id="app-header" style="display: none;">
    <header>
      <div class="logo">🎰 OLYMPIADE <span style="font-size: 0.9rem; color: var(--gold);" id="header-room-display"></span></div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button class="btn btn-dark btn-sm" onclick="openModal('legend-modal')">📖 Joker-Legende</button>
        <span id="role-badge" class="btn btn-sm btn-green">Teilnehmer</span>
      </div>
    </header>
  </div>

  <!-- MAIN APP BODY -->
  <div id="app-body" class="app-container" style="display: none;">
    
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="card">
        <div class="card-title">🏆 Scoreboard</div>
        <div id="scoreboard-list"></div>
      </div>

      <!-- Host Controls -->
      <div id="host-panel" class="card host-only" style="margin-top: 20px; border-color: var(--casino-red); display: none;">
        <div class="card-title" style="color: #e74c3c;">👑 Host Steuerung</div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button class="btn btn-red" onclick="skipGame()">⏭️ Spiel Abbrechen / Skippen</button>
          <button class="btn btn-blue" onclick="openScoreEditModal()">✏️ Punkte Eintragen</button>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      
      <!-- Status Banner -->
      <div class="phase-card">
        <div class="phase-title" id="phase-title">Bereit für den ersten Dreh!</div>
        <div class="timer-display" id="timer-display">00:00</div>
        
        <div style="margin-top: 15px; display: flex; justify-content: center; gap: 10px;" class="host-only" style="display: none;">
          <button class="btn btn-gold" onclick="triggerHostSpin()">🎡 Rad Drehen!</button>
          <button class="btn btn-blue" onclick="toggleTimer()">⏯️ Timer Start</button>
          <button class="btn btn-dark" onclick="resetTimer()">⏱️ Reset</button>
        </div>
      </div>

      <!-- Wheel and Games List -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="card" style="text-align: center;">
          <div class="card-title">🎡 Glücksrad</div>
          <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <canvas id="wheel" width="320" height="320"></canvas>
          </div>
        </div>

        <div class="card">
          <div class="card-title">🎮 Spiele-Setup</div>
          <div id="setup-game-list" style="max-height: 280px; overflow-y: auto;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- JOKER MODAL -->
  <div class="modal-overlay" id="joker-modal">
    <div class="modal-box" style="text-align: center;">
      <h2 style="font-family:'Fredoka One'; color: var(--gold-light); font-size: 2rem;">🃏 JOKER-PHASE (20s)</h2>
      <p id="joker-game-title" style="font-size: 1.3rem; font-weight: 800; color: #2ecc71; margin: 10px 0;"></p>
      <div style="margin: 20px 0; text-align: left;">
        <div class="card" style="margin-bottom: 12px; background: #141c28;">
          <h4 style="color: var(--gold);">🔥 High-Stakes Joker (5 / 4 / 2 Punkte)</h4>
          <button class="btn btn-gold btn-sm" style="margin-top: 8px;" onclick="useJoker('high_stakes')">High-Stakes Aktivieren</button>
        </div>
        <div class="card" id="balance-card" style="background: #141c28;">
          <h4 style="color: #2ecc71;">⚖️ Ausgleichs-Joker</h4>
          <p id="balance-desc" style="font-size: 0.85rem; color: var(--text-dim); margin: 6px 0;"></p>
          <button class="btn btn-blue btn-sm" onclick="useJoker('balance')">Ausgleichs-Joker Aktivieren</button>
        </div>
      </div>
      <button class="btn btn-dark" onclick="closeModal('joker-modal')">Weiter ohne Joker</button>
    </div>
  </div>

  <!-- LEGEND MODAL -->
  <div class="modal-overlay" id="legend-modal">
    <div class="modal-box">
      <div class="card-title">📖 Joker & Spiel-Regeln</div>
      <div id="legend-content" style="max-height: 60vh; overflow-y: auto;"></div>
      <button class="btn btn-dark" style="margin-top: 15px; width: 100%;" onclick="closeModal('legend-modal')">Schließen</button>
    </div>
  </div>

  <!-- SCORE EDIT MODAL -->
  <div class="modal-overlay" id="score-modal">
    <div class="modal-box">
      <div class="card-title">✏️ Punkte Eintragen</div>
      <div id="score-edit-list"></div>
      <button class="btn btn-gold" style="margin-top: 15px; width: 100%;" onclick="saveScores()">Speichern</button>
    </div>
  </div>

  <script>
    // --- FIREBASE CONFIG (Demo Fallback) ---
    const firebaseConfig = {
      apiKey: "AIzaSyDemoOlympiadeConfigKey2026",
      authDomain: "gaming-olympiade-2026.firebaseapp.com",
      projectId: "gaming-olympiade-2026"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const STATE = {
      role: 'player',
      roomCode: '',
      myPlayerId: 'p_' + Math.random().toString(36.substring(2, 9)),
      myName: '',
      myAvatar: 0
    };

    const SPONGEBOB_AVATARS = Array.from({length: 25}, (_, i) => i);

    const GAMES = [
      { id: 'mc', name: 'Minecraft', hasBalance: true, desc: '40m Timer & Erz-Slot Bonus.', color: '#2ecc71' },
      { id: 'golf', name: 'Golf With Your Friends', hasBalance: true, desc: 'Slot zieht Extra-Schläge ab.', color: '#27ae60' },
      { id: 'buckshot', name: 'Buckshot Roulette', hasBalance: true, desc: 'Joker erlaubt Reroll / Patrone stornieren.', color: '#e74c3c' },
      { id: 'quiz', name: 'Personen Erkennen', hasBalance: true, desc: 'Joker streicht 2 falsche Antworten.', color: '#f1c40f' },
      { id: 'speed', name: 'SpeedRunners', hasBalance: true, desc: '1v1 Showdown (+3 Pkt Sieg / +1 Pkt Gegner).', color: '#e67e22' },
      { id: 'price', name: 'Guess the Price', hasBalance: false, desc: 'Schätzspiel (Kein Ausgleichs-Joker).', color: '#9b59b6' },
      { id: 'geo', name: 'GeoBingo', hasBalance: false, desc: 'Geoguessr Map Bingo (Kein Ausgleichs-Joker).', color: '#3498db' },
      { id: 'slf', name: 'Stadt Land Fluss', hasBalance: false, desc: 'Klassiker Kategorien (Kein Ausgleichs-Joker).', color: '#1abc9c' },
      { id: 'uno', name: 'Uno', hasBalance: false, desc: 'Kartenspiel (Pure Skill).', color: '#e74c3c' },
      { id: 'skribbl', name: 'Skribbl.io', hasBalance: false, desc: 'Malen & Erraten (Pure Skill).', color: '#f39c12' }
    ];

    let activeGames = [...GAMES];
    let hostAvatarChoice = 0;
    let playerAvatarChoice = 0;

    function getFishAvatarSVG(id) {
      const colors = ['#f39c12', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#1abc9c', '#d35400', '#f1c40f'];
      const bg = colors[id % colors.length];
      return `<svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="48" fill="${bg}"/>
        <ellipse cx="50" cy="55" rx="30" ry="22" fill="#fff" opacity="0.3"/>
        <circle cx="35" cy="40" r="8" fill="#fff"/><circle cx="35" cy="40" r="4" fill="#000"/>
        <circle cx="65" cy="40" r="8" fill="#fff"/><circle cx="65" cy="40" r="4" fill="#000"/>
        <path d="M 35 65 Q 50 80 65 65" stroke="#000" stroke-width="4" fill="none"/>
      </svg>`;
    }

    window.onload = () => {
      renderAvatarGrid('host-avatar-grid', (id) => hostAvatarChoice = id);
      renderAvatarGrid('player-avatar-grid', (id) => playerAvatarChoice = id);
      renderLegend();
    };

    function renderAvatarGrid(containerId, callback) {
      const grid = document.getElementById(containerId);
      grid.innerHTML = '';
      SPONGEBOB_AVATARS.forEach(id => {
        const div = document.createElement('div');
        div.className = `avatar-item ${(callback === hostAvatarChoice ? hostAvatarChoice : playerAvatarChoice) === id ? 'selected' : ''}`;
        div.innerHTML = getFishAvatarSVG(id);
        div.onclick = () => {
          callback(id);
          document.querySelectorAll(`#${containerId} .avatar-item`).forEach(el => el.classList.remove('selected'));
          div.classList.add('selected');
        };
        grid.appendChild(div);
      });
    }

    function switchLoginTab(tab) {
      document.getElementById('tab-host').style.display = tab === 'host' ? 'block' : 'none';
      document.getElementById('tab-player').style.display = tab === 'player' ? 'block' : 'none';
    }

    function createRoomAsHost() {
      const code = document.getElementById('host-room-input').value.trim().toUpperCase();
      const pin = document.getElementById('host-pin-input').value;
      const name = document.getElementById('host-name-input').value.trim() || 'Host';

      if (pin !== '1234') { alert('Falscher PIN! (Standard: 1234)'); return; }
      if (!code) { alert('Bitte Raum-Code eingeben!'); return; }

      STATE.role = 'host';
      STATE.roomCode = code;
      STATE.myName = name;
      STATE.myAvatar = hostAvatarChoice;

      db.collection('rooms').doc(code).set({
        createdAt: Date.now(),
        spinTarget: 0,
        currentGame: null,
        timerSec: 0
      }, { merge: true });

      enterAppRoom();
    }

    function joinRoomAsPlayer() {
      const code = document.getElementById('player-room-input').value.trim().toUpperCase();
      const name = document.getElementById('player-name-input').value.trim() || 'Teilnehmer';

      if (!code) { alert('Bitte Raum-Code eingeben!'); return; }

      STATE.role = 'player';
      STATE.roomCode = code;
      STATE.myName = name;
      STATE.myAvatar = playerAvatarChoice;

      enterAppRoom();
    }

    function enterAppRoom() {
      document.getElementById('screen-login').style.display = 'none';
      document.getElementById('app-header').style.display = 'block';
      document.getElementById('app-body').style.display = 'grid';
      document.getElementById('header-room-display').textContent = `(Raum: ${STATE.roomCode})`;

      const badge = document.getElementById('role-badge');
      badge.textContent = STATE.role === 'host' ? '👑 Host' : '👤 Teilnehmer';
      badge.className = STATE.role === 'host' ? 'btn btn-sm btn-red' : 'btn btn-sm btn-green';

      if (STATE.role === 'host') {
        document.querySelectorAll('.host-only').forEach(el => el.style.display = 'block');
      }

      // Register player in Firebase room
      db.collection('rooms').doc(STATE.roomCode).collection('players').doc(STATE.myPlayerId).set({
        id: STATE.myPlayerId,
        name: STATE.myName,
        avatar: STATE.myAvatar,
        score: 0,
        jokersHigh: 1,
        jokersBal: 1
      });

      startRealtimeSync();
      renderGamesList();
      drawWheel();
    }

    function startRealtimeSync() {
      // Listen to players
      db.collection('rooms').doc(STATE.roomCode).collection('players').onSnapshot(snapshot => {
        const players = [];
        snapshot.forEach(doc => players.push(doc.data()));
        renderScoreboard(players);
      });

      // Listen to room events
      db.collection('rooms').doc(STATE.roomCode).onSnapshot(doc => {
        const data = doc.data();
        if (!data) return;

        if (data.spinTarget) {
          animateWheelSpin(data.spinTarget);
        }
        if (data.currentGame) {
          const game = GAMES.find(g => g.id === data.currentGame);
          if (game) {
            document.getElementById('phase-title').textContent = `Aktuelles Spiel: ${game.name}`;
            openJokerModal(game);
          }
        }
        if (data.timerSec !== undefined) {
          updateTimerDisplay(data.timerSec);
        }
      });
    }

    function renderScoreboard(players) {
      const list = document.getElementById('scoreboard-list');
      list.innerHTML = '';
      players.sort((a,b) => b.score - a.score).forEach(p => {
        list.innerHTML += `
          <div class="player-card">
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="player-avatar">${getFishAvatarSVG(p.avatar)}</div>
              <div>
                <div class="player-name">${p.name} ${p.id === STATE.myPlayerId ? '(Du)' : ''}</div>
                <div style="display:flex; gap:4px; margin-top:2px;">
                  <span class="joker-pill ${p.jokersHigh > 0 ? 'active' : ''}">🔥 High</span>
                  <span class="joker-pill ${p.jokersBal > 0 ? 'active' : ''}">⚖️ Bal</span>
                </div>
              </div>
            </div>
            <div class="player-score">${p.score} Pkt</div>
          </div>
        `;
      });
    }

    function drawWheel() {
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');
      const num = activeGames.length;
      if (num === 0) return;
      const angleStep = (2 * Math.PI) / num;
      ctx.clearRect(0,0,320,320);

      activeGames.forEach((game, i) => {
        const start = i * angleStep;
        const end = start + angleStep;
        ctx.beginPath(); ctx.moveTo(160, 160); ctx.arc(160, 160, 150, start, end);
        ctx.fillStyle = game.color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
        
        ctx.save(); ctx.translate(160, 160); ctx.rotate(start + angleStep / 2);
        ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Nunito';
        ctx.fillText(`${game.hasBalance ? '🟢' : '🔴'} ${game.name}`, 130, 4);
        ctx.restore();
      });
    }

    function triggerHostSpin() {
      const rot = 1440 + Math.floor(Math.random() * 360);
      db.collection('rooms').doc(STATE.roomCode).update({ spinTarget: rot });
    }

    function animateWheelSpin(rot) {
      const wheel = document.getElementById('wheel');
      wheel.style.transform = `rotate(${rot}deg)`;
      setTimeout(() => {
        const seg = 360 / activeGames.length;
        const index = Math.floor((360 - (rot % 360)) / seg) % activeGames.length;
        const game = activeGames[index];
        if (STATE.role === 'host') {
          db.collection('rooms').doc(STATE.roomCode).update({ currentGame: game.id, spinTarget: 0 });
        }
      }, 4000);
    }

    function openJokerModal(game) {
      document.getElementById('joker-game-title').textContent = game.name;
      const card = document.getElementById('balance-card');
      if (game.hasBalance) {
        card.style.display = 'block';
        document.getElementById('balance-desc').textContent = game.desc;
      } else {
        card.style.display = 'none';
      }
      openModal('joker-modal');
    }

    function useJoker(type) {
      alert(`Joker (${type}) aktiviert!`);
      closeModal('joker-modal');
    }

    function renderGamesList() {
      const list = document.getElementById('setup-game-list');
      list.innerHTML = '';
      GAMES.forEach(g => {
        const isActive = activeGames.some(x => x.id === g.id);
        list.innerHTML += `
          <div class="player-card" style="opacity: ${isActive ? '1' : '0.4'};">
            <div><strong>${g.name}</strong> ${g.hasBalance ? '🟢' : '🔴'}</div>
            <button class="btn btn-red btn-sm host-only" style="display: ${STATE.role === 'host' ? 'inline-flex' : 'none'}" onclick="toggleGame('${g.id}')">
              ${isActive ? '❌ Entfernen' : '➕'}
            </button>
          </div>
        `;
      });
    }

    function toggleGame(id) {
      if (activeGames.some(g => g.id === id)) {
        activeGames = activeGames.filter(g => g.id !== id);
      } else {
        const g = GAMES.find(x => x.id === id);
        if (g) activeGames.push(g);
      }
      renderGamesList();
      drawWheel();
    }

    function skipGame() {
      if (confirm('Spiel abbrechen?')) {
        db.collection('rooms').doc(STATE.roomCode).update({ currentGame: null });
      }
    }

    function toggleTimer() {
      db.collection('rooms').doc(STATE.roomCode).update({ timerSec: 2400 });
    }

    function resetTimer() {
      db.collection('rooms').doc(STATE.roomCode).update({ timerSec: 0 });
    }

    function updateTimerDisplay(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      document.getElementById('timer-display').textContent = `${m}:${s}`;
    }

    function renderLegend() {
      const container = document.getElementById('legend-content');
      container.innerHTML = '';
      GAMES.forEach(g => {
        container.innerHTML += `<div style="margin-bottom:10px;"><h4 style="color:var(--gold);">${g.name} ${g.hasBalance ? '🟢' : '🔴'}</h4><p style="font-size:0.9rem; color:var(--text-dim);">${g.desc}</p></div>`;
      });
    }

    function openScoreEditModal() {
      db.collection('rooms').doc(STATE.roomCode).collection('players').get().then(snap => {
        const list = document.getElementById('score-edit-list');
        list.innerHTML = '';
        snap.forEach(doc => {
          const p = doc.data();
          list.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;"><span>${p.name}</span><input type="number" id="edit-score-${p.id}" class="form-control" style="width:100px; padding:6px;" value="${p.score}"></div>`;
        });
        openModal('score-modal');
      });
    }

    function saveScores() {
      db.collection('rooms').doc(STATE.roomCode).collection('players').get().then(snap => {
        snap.forEach(doc => {
          const p = doc.data();
          const input = document.getElementById(`edit-score-${p.id}`);
          if (input) {
            const val = parseInt(input.value);
            if (!isNaN(val)) {
              db.collection('rooms').doc(STATE.roomCode).collection('players').doc(p.id).update({ score: val });
            }
          }
        });
        closeModal('score-modal');
      });
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  </script>
</body>
</html>
